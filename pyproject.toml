[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogi"
version = "0.3.3"
description = "Qt manager for Logitech mice, keyboards and webcams (HID++)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Hardware",
]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5", "PySide6-Addons>=6.5"]

[project.optional-dependencies]
hidapi = ["hidapi"]   # Windows transport
build = ["pyinstaller"]   # python scripts/build_release.py

[project.scripts]
pylogi = "pylogi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pylogi = ["locales/*.json", "themes/*.json", "data/*.svg", "data/LICENSE", "data/help/*.html", "data/*.ico", "data/*.png", "data/icons/*.png", "data/gnome-extension/*/*"]

[tool.ruff]
line-length = 130
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S110"]
ignore = ["E501", "E402", "E701", "E702", "E741", "B008", "B904", "UP007", "UP045", "UP037", "UP035", "UP006", "UP028", "UP031", "E731", "B905", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "B007"]   # QApplication handles are kept alive on purpose
"src/pylogi/ui/theme.py" = ["F821"]   # palette names are injected into the module globals at runtime

[tool.mypy]
python_version = "3.10"
files = ["src/pylogi/core", "src/pylogi/hidpp"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
follow_imports = "silent"
# Devices are duck-typed on purpose (capabilities such as cam_controls / slot exist only on some classes)
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# known baseline, to be tightened gradually: colour tuples, Qt enums, receiver device wiring
module = ["pylogi.core.lighting_fx", "pylogi.hidpp.onboard", "pylogi.core.images", "pylogi.core.manager",
          "pylogi.core.removal", "pylogi.core.actions"]
ignore_errors = true

[tool.coverage.run]
source = ["src/pylogi"]
branch = true

[tool.coverage.report]
show_missing = false
skip_empty = true
