name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install ruff mypy
      - run: ruff check .
      - run: python scripts/lint.py
      - run: python scripts/i18n_tool.py check
      - name: Types (core and hidpp)
        run: pip install -e . && mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", allow-prereleases: true}
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - run: pip install -e . build coverage
      - run: python scripts/gen_docs.py --check
      - name: Tests with coverage
        # run_tests.py leaves without Qt's interpreter-exit teardown (it segfaults after a green run)
        run: |
          python -I scripts/run_tests.py --coverage
          coverage report --skip-covered | tail -n 40
          coverage xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with: {name: coverage, path: coverage.xml}
      - run: python -m build --wheel

  # The README promises Windows and macOS: these jobs report breakage there (the transport is hidapi).
  # Not blocking yet: the suite was written on Linux and has not been verified on these systems.
  other-os:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -e ".[hidapi]"
      - run: python -I scripts/run_tests.py

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Tools
        run: dnf -y install git rpm-build rpmdevtools python3-devel pyproject-rpm-macros python3-setuptools desktop-file-utils systemd-rpm-macros python3-pyside6 python3-pip
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 scripts/build_rpm.py
      - run: rpm -qlp dist/pylogi-*.noarch.rpm && rpm -qRp dist/pylogi-*.noarch.rpm
      - uses: actions/upload-artifact@v4
        with: {name: rpm, path: dist/*.rpm}
