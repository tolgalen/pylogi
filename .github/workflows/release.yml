# Push a tag such as v0.2.1 (it must match pylogi.__version__) to build the packages and publish a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          v=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/pylogi/__init__.py').read_text()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - run: pip install -e ".[hidapi,build]"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with: {name: "bundle-${{ matrix.os }}", path: "dist/*"}

  rpm:
    needs: check
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf -y install git rpm-build rpmdevtools python3-devel pyproject-rpm-macros python3-setuptools desktop-file-utils systemd-rpm-macros python3-pyside6
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 scripts/build_rpm.py
      - uses: actions/upload-artifact@v4
        with: {name: rpm, path: "dist/*.rpm"}

  deb:
    needs: check
    runs-on: ubuntu-latest
    container: ubuntu:22.04          # the oldest target: a bundle built here runs on newer glibc (Debian 12/13, Ubuntu 22.04+)
    steps:
      - run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y python3 python3-pip python3-venv dpkg-dev binutils git libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libglib2.0-0
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv /venv && . /venv/bin/activate
          pip install pyinstaller PySide6-Essentials PySide6-Addons
          python scripts/build_deb.py
      - uses: actions/upload-artifact@v4
        with: {name: deb, path: "dist/*.deb"}

  publish:
    needs: [bundle, rpm, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "pyLogi $v" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/*
